{% extends "base.html" %}
{% block title %}Signed out{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<main class="auth-viewport">
  <div class="auth-card">
    <a href="/"><img src="/assets/logo-dark.png" alt="Short Circuit" class="auth-logo"></a>
    <h1 class="auth-title">Signed Out</h1>
    <p class="auth-subtitle">Your identity-provider session has ended.</p>

    <p class="muted" style="margin-bottom: 1.5rem; font-size: 0.85rem;">Product sessions already issued are not revoked from here.</p>

    <div style="margin-top: 1.5rem;">
      <a href="/login" class="btn btn-block">Sign In Again</a>
    </div>
  </div>
</main>
{% endblock %}
