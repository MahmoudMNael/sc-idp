{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<main class="auth-viewport">
  <div class="auth-card">
    <a href="/"><img src="/assets/logo-dark.png" alt="Short Circuit" class="auth-logo"></a>
    <h1 class="auth-title">{{ title }}</h1>
    <p class="auth-subtitle">{{ message }}</p>

    <div style="margin-top: 2rem;">
      <a href="/login" class="btn btn-block">Back to Sign In</a>
    </div>
  </div>
</main>
{% endblock %}
