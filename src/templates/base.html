<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %}</title>
  <style>
    :root { color-scheme: light; }
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; background: #f4f4f5; color: #18181b; }
    main { max-width: 28rem; margin: 3rem auto; background: #fff; padding: 2rem; border-radius: 8px;
           box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); }
    h1 { font-size: 1.25rem; margin: 0 0 1rem; }
    label { display: block; font-weight: 600; margin: 0.75rem 0 0.25rem; }
    input { width: 100%; box-sizing: border-box; padding: 0.6rem 0.7rem; font: inherit; border: 1px solid #d4d4d8; border-radius: 6px; }
    button, .btn { display: inline-block; margin-top: 1rem; padding: 0.7rem 1rem; font: inherit; font-weight: 600;
                   border: 0; border-radius: 6px; background: #18181b; color: #fff; cursor: pointer; text-decoration: none; }
    button.secondary, .btn.secondary { background: #e4e4e7; color: #18181b; margin-left: 0.5rem; }
    .error { background: #fef2f2; color: #991b1b; padding: 0.6rem 0.8rem; border-radius: 6px; margin-bottom: 1rem; }
    .ok { background: #f0fdf4; color: #166534; padding: 0.6rem 0.8rem; border-radius: 6px; margin-bottom: 1rem; }
    .muted { color: #52525b; font-size: 0.9rem; }
    ul { padding-left: 1.2rem; }
    code { font-size: 0.9em; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
