<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <title>{% block title %}Short Circuit IdP{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --surface: #111111;
      --surface-elevated: #181818;
      --border: #2B2B2B;
      --border-hover: #3A3A3A;
      --text: #FFFFFF;
      --text-muted: #B8B8B8;
      --text-disabled: #7A7A7A;
      --accent: #EB1B26;
      --accent-hover: #A80F18;
      --success: #1FA971;
      --warning: #F4B740;
      --font-display: 'Anton', sans-serif;
      --font-sans: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .sc-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 2rem;
    }
    .sc-header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .sc-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text);
    }
    .sc-logo {
      height: 28px;
      width: auto;
      display: block;
    }
    .sc-brand-name {
      font-family: var(--font-display);
      font-size: 1.15rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text);
    }
    .sc-nav-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      font-size: 0.875rem;
    }
    .sc-nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 150ms ease;
    }
    .sc-nav-links a:hover, .sc-nav-links a.active {
      color: var(--accent);
    }
    .container-auth {
      max-width: 28rem;
      margin: 3rem auto;
      background: var(--surface);
      padding: 2.25rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .container-xl {
      max-width: 1280px;
      margin: 2.5rem auto;
      padding: 0 2rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.85rem;
      letter-spacing: 0.02em;
      margin: 0 0 1.25rem;
      text-transform: uppercase;
      font-weight: 400;
      color: var(--text);
    }
    h2 {
      font-family: var(--font-display);
      font-size: 1.35rem;
      letter-spacing: 0.02em;
      margin: 0 0 1rem;
      text-transform: uppercase;
      font-weight: 400;
    }
    h3 {
      font-size: 1.05rem;
      margin: 0 0 0.5rem;
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      margin: 1rem 0 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input, textarea, select {
      width: 100%;
      height: 48px;
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 1rem;
      font: inherit;
      font-size: 0.95rem;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    textarea {
      height: auto;
      padding: 0.75rem 1rem;
    }
    input:hover, textarea:hover, select:hover {
      border-color: var(--border-hover);
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(235, 27, 38, 0.2);
    }
    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      height: 48px;
      padding: 0 1.5rem;
      font-family: var(--font-sans);
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      border: 1px solid transparent;
      border-radius: 12px;
      background: var(--accent);
      color: #FFFFFF;
      cursor: pointer;
      text-decoration: none;
      transition: background 150ms ease, border-color 150ms ease;
    }
    button:hover, .btn:hover {
      background: var(--accent-hover);
    }
    button.secondary, .btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.secondary:hover, .btn.secondary:hover {
      background: var(--surface-elevated);
      border-color: var(--border-hover);
      color: #FFFFFF;
    }
    button:disabled, .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: var(--border);
      color: var(--text-disabled);
      pointer-events: none;
    }
    button.sm, .btn.sm {
      height: 36px;
      padding: 0 0.85rem;
      font-size: 0.75rem;
      border-radius: 8px;
      margin-top: 0;
    }
    .btn-block {
      width: 100%;
      margin-top: 1.25rem;
    }
    /* Auth card and layout according to DESIGN.md */
    .auth-viewport {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .auth-logo {
      height: 34px;
      width: auto;
      margin: 0 auto 1.5rem;
      display: block;
    }
    .auth-title {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin: 0 0 0.4rem;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1.1;
    }
    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin: 0 0 1.75rem;
      line-height: 1.5;
    }
    .auth-client-target {
      color: var(--text);
      font-weight: 600;
    }
    .auth-form {
      text-align: left;
    }
    .auth-footer {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      align-items: center;
    }
    .auth-footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 150ms ease;
    }
    .auth-footer a:hover {
      color: var(--text);
      text-decoration: underline;
    }
    .auth-cancel {
      color: var(--text-disabled) !important;
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }
    .auth-cancel:hover {
      color: var(--accent) !important;
    }

    .error {
      background: #1b0708;
      border: 1px solid #5a1417;
      color: #ff6b72;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      font-size: 0.875rem;
    }
    .ok {
      background: #091a10;
      border: 1px solid #134e2c;
      color: #4ade80;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      font-size: 0.875rem;
    }
    .muted {
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    code, pre {
      font-family: var(--font-mono);
      font-size: 0.875rem;
    }
    code {
      background: var(--surface-elevated);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: #fca5a5;
    }
    /* Table styles according to DESIGN.md */
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1rem;
    }
    td {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
      vertical-align: middle;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background: var(--surface-elevated);
    }
    /* Badges */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-success { background: #0c2b18; color: var(--success); border: 1px solid #134e2c; }
    .badge-muted { background: #1c1c1c; color: var(--text-disabled); border: 1px solid var(--border); }
    .badge-accent { background: #2b0b0e; color: var(--accent); border: 1px solid #6b1419; }
    /* Card container */
    .sc-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
      margin-bottom: 2rem;
    }
    .sc-grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 960px) {
      .sc-grid-2 {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  {% block header %}
  <header class="sc-header">
    <div class="sc-header-inner">
      <a href="/" class="sc-brand">
        <img src="/assets/logo-dark.png" alt="Short Circuit" class="sc-logo">
        <span class="sc-brand-name">SHORT CIRCUIT</span>
      </a>
      <nav class="sc-nav-links">
        {% block nav %}
          <a href="/">Home</a>
          <a href="/login">Sign in</a>
        {% endblock %}
      </nav>
    </div>
  </header>
  {% endblock %}
  {% block content %}
  <main class="{% block main_class %}container-auth{% endblock %}">
    {% block body %}{% endblock %}
  </main>
  {% endblock %}
</body>
</html>
