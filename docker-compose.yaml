services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sc_idp
      MYSQL_USER: sc_user
      MYSQL_PASSWORD: sc_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-prootpassword']
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 15s

  web:
    build: .
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./assets:/app/assets
      - ./migrations:/app/migrations
      - ./tests:/app/tests
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./assets
          target: /app/assets
        - action: sync
          path: ./migrations
          target: /app/migrations
        - action: sync
          path: ./tests
          target: /app/tests
        - action: rebuild
          path: pyproject.toml

volumes:
  mysql_data:
