[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-idp"
version = "0.1.0"
description = "Central OIDC identity provider. Identity only; products own authorization."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncmy>=0.2.10",
    "pymysql>=1.1.1",
    "alembic==1.19.2",
    "pydantic-settings==2.15.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.1",
    "joserfc==1.7.5",
    "pyotp==2.10.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",
    "httpx==0.28.1",
    "Authlib==1.8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["templates/*.html", "templates/**/*.html"]
